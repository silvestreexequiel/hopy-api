name: keepalive

# Mantiene despierta la API en Render (free tier duerme tras ~15 min de inactividad).
# Le pega a la URL cada 10 minutos para evitar cold starts durante el pentest.

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos (GitHub puede demorar algunos minutos)
  workflow_dispatch:          # permite dispararlo a mano desde la pestana Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          for path in "/" "/api/v1/status"; do
            code=$(curl -sS -m 60 -o /dev/null -w "%{http_code}" "https://hopi-api.onrender.com${path}" || echo "000")
            echo "GET ${path} -> ${code}"
          done
